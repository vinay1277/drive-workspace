name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-types-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,flask,docs]

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy --strict drive_workspace/

      - name: Pytest
        run: pytest

      - name: Sphinx (warnings as errors)
        # Phase 3.4a — fail CI on docstring drift. The session's
        # original docstring pass landed clean under -W; CI keeps it
        # that way.
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
