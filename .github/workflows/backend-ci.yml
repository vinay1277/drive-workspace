name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-types-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,flask]

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy --strict drive_workspace/

      - name: Pytest
        # Phase 1 has no real tests yet; exit code 5 means "no tests collected"
        # which we treat as success until Phase 3.
        run: |
          set +e
          pytest
          code=$?
          if [ $code -eq 0 ] || [ $code -eq 5 ]; then
            exit 0
          else
            exit $code
          fi
