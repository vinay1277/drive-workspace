[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive_workspace"
version = "0.0.1"
description = "Backend-mediated Google Drive uploads, per-principal folders, and spreadsheet logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "drive-workspace authors" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "google-api-python-client>=2.120",
    "google-auth>=2.30",
    "google-auth-httplib2>=0.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
flask = ["flask>=3.0", "flask-restx>=1.3"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drive_workspace*"]
exclude = ["tests*", "reference_server*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.auth.*", "google.oauth2.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["drive_workspace/tests", "reference_server/tests"]
addopts = "-q --strict-markers --strict-config"
